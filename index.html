<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AllRound Playlist URL</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: white;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 700px;
      background: #1e293b;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,.4);
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 28px;
    }

    .url-box {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      min-width: 250px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    button {
      padding: 14px 25px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 15px;
      transition: .3s;
    }

    button:hover {
      background: #1d4ed8;
    }

    .status {
      margin-top: 15px;
      color: #22c55e;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="card">
    <h1>AllRound Playlist URL</h1>

    <div class="url-box">
        <input
            type="text"
            id="playlistUrl"
            value="https://techcoders.dhruvpatil681.workers.dev/AllRound"
            readonly
        >
        <button onclick="copyURL()">Copy</button>
    </div>

    <div class="status" id="status"></div>
</div>

<script>
function copyURL() {
    const input = document.getElementById("playlistUrl");

    navigator.clipboard.writeText(input.value).then(() => {
        document.getElementById("status").textContent = "✅ URL Copied!";
        setTimeout(() => {
            document.getElementById("status").textContent = "";
        }, 2000);
    });
}
</script>

</body>
</html>
